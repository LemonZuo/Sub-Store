name: docker-build

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild even if upstream tag unchanged"
        required: false
        default: "false"
  schedule:
    # 每 6 小时检查一次上游 sub-store-org 的最新 tag
    - cron: "0 */6 * * *"

jobs:
  front:
    name: build front image
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: sub-store-org/Sub-Store-Front-End
      HUB_REPO: sub-store
      DOCKERFILE: ./Dockerfile
      CONTEXT: ./front
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve upstream latest tag
        id: tag
        run: |
          TAG=$(curl -fsSL https://api.github.com/repos/${UPSTREAM_REPO}/tags | jq -r '.[0].name')
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "No upstream tag found." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Upstream latest tag: $TAG"

      - name: Check Docker Hub for existing tag
        id: check
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          FORCE="${{ github.event.inputs.force }}"
          if [ "$FORCE" = "true" ]; then
            echo "Force rebuild requested."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://hub.docker.com/v2/repositories/${{ secrets.DOCKERHUB_USERNAME }}/${HUB_REPO}/tags/${TAG}")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Tag ${TAG} already exists on Docker Hub, skipping build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${TAG} not found on Docker Hub (HTTP ${HTTP_CODE}), proceeding with build."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.check.outputs.skip == 'false'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.check.outputs.skip == 'false'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.check.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.CONTEXT }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          no-cache: true
          provenance: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.HUB_REPO }}:${{ steps.tag.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.HUB_REPO }}:latest

  backend:
    name: build backend image
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: sub-store-org/Sub-Store
      HUB_REPO: sub-store-api
      CONTEXT: ./backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve upstream latest tag
        id: tag
        run: |
          TAG=$(curl -fsSL https://api.github.com/repos/${UPSTREAM_REPO}/tags | jq -r '.[0].name')
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "No upstream tag found." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Upstream latest tag: $TAG"

      - name: Check Docker Hub for existing tag
        id: check
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          FORCE="${{ github.event.inputs.force }}"
          if [ "$FORCE" = "true" ]; then
            echo "Force rebuild requested."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://hub.docker.com/v2/repositories/${{ secrets.DOCKERHUB_USERNAME }}/${HUB_REPO}/tags/${TAG}")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Tag ${TAG} already exists on Docker Hub, skipping build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${TAG} not found on Docker Hub (HTTP ${HTTP_CODE}), proceeding with build."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.check.outputs.skip == 'false'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.check.outputs.skip == 'false'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.check.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.CONTEXT }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          no-cache: true
          provenance: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.HUB_REPO }}:${{ steps.tag.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.HUB_REPO }}:latest
